services:
  postgres:
    image: postgres:18
    container_name: rasping-amazon-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: rasping_amazon
      POSTGRES_USER: rasping
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: