name: Amazon source probe

on:
  workflow_dispatch:

  schedule:
    - cron: "17 10 * * *"

jobs:
  probe:
    name: External Amazon source probe

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Show Maven Wrapper version
        run: ./mvnw --version

      - name: Run external Amazon probe
        run: ./mvnw --batch-mode -Pexternal-probe test

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amazon-source-diagnostic
          path: target/diagnostics/
          if-no-files-found: ignore
          retention-days: 3
