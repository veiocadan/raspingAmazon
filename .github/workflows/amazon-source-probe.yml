name: Amazon source probe

on:
  workflow_dispatch:

  schedule:
    - cron: "17 10 * * *"

jobs:
  probe:
    name: External Amazon source probe

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Show Maven Wrapper version
        run: ./mvnw --version

      - name: Run Amazon deals source probe
        run: ./mvnw --batch-mode -Pexternal-probe -Dtest=AmazonDealsExternalProbeIT test

      - name: Require conclusive source result
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path(
              "target/surefire-reports/"
              "TEST-com.raspingamazon.infrastructure.amazon."
              "AmazonDealsExternalProbeIT.xml"
          )

          if not report.is_file():
              raise SystemExit("FAIL: source probe report missing")

          suite = ET.parse(report).getroot()

          counts = {
              key: int(suite.get(key, "0"))
              for key in ("tests", "failures", "errors", "skipped")
          }

          if counts != {
              "tests": 1,
              "failures": 0,
              "errors": 0,
              "skipped": 0
          }:
              raise SystemExit(
                  "INCONCLUSIVE: Amazon source not validated: "
                  + str(counts)
              )

          print("PASS - Amazon source probe conclusive")
          PY

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amazon-source-diagnostic
          path: target/diagnostics/
          if-no-files-found: ignore
          retention-days: 3