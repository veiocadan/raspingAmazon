name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  test:
    name: Maven tests

    runs-on: ubuntu-latest

    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6

        env:
          POSTGRES_DB: rasping_amazon
          POSTGRES_USER: rasping
          POSTGRES_PASSWORD: rasping_ci

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U rasping -d rasping_amazon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: ci

      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: rasping_amazon
      DB_USER: rasping
      DB_PASSWORD: rasping_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Show Java version
        run: java -version

      - name: Show Maven Wrapper version
        run: ./mvnw --version

      - name: Apply and validate database migrations
        run: ./mvnw --batch-mode -Dtest=DatabaseMigrationTest test

      - name: Run hermetic test suite
        run: ./mvnw --batch-mode test
